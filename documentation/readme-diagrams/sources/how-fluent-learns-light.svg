<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" height="230" font-family="Menlo">
  <defs>
    <style>
      .container { stroke: #ddd; stroke-width: 1; fill: #ffffff; }
      .box { stroke: #ddd; stroke-width: 1; fill: #f6f6f6; }
      .principal { stroke: #999; stroke-width: 1.25; fill: #f6f6f6; }
      .title { fill: #292929; font-size: 10px; font-weight: 600; text-anchor: middle; }
      .text { fill: #999; font-size: 8.5px; text-anchor: middle; }
      .label { fill: #bbb; font-size: 8px; text-anchor: middle; letter-spacing: 0.5px; }
      .caption { fill: #999; font-size: 9.5px; text-anchor: middle; }
      .line { stroke: #292929; stroke-width: 1; fill: none; }
      .arrow { stroke: #292929; stroke-width: 1; fill: none; marker-end: url(#arrowhead); }
      .curation { stroke: #999; stroke-width: 1; stroke-dasharray: 3 3; fill: none; marker-end: url(#muted-arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#292929"/>
    </marker>
    <marker id="muted-arrowhead" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#999"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="230" fill="#ffffff"/>

  <!-- Inputs -->
  <text x="67" y="67" class="title">completed change</text>
  <text x="67" y="143" class="title">Tester + reviews</text>
  <text x="67" y="159" class="text">all evidence</text>
  <line x1="118" y1="64" x2="147" y2="64" class="line"/>
  <line x1="118" y1="140" x2="147" y2="140" class="line"/>
  <line x1="147" y1="64" x2="147" y2="140" class="line"/>
  <line x1="147" y1="102" x2="177" y2="102" class="arrow"/>

  <!-- Learner -->
  <rect x="180" y="63" width="95" height="78" rx="4" class="box"/>
  <text x="227.5" y="93" class="title">Learner</text>
  <text x="227.5" y="113" class="text">durable facts</text>
  <text x="227.5" y="127" class="text">or no change</text>
  <line x1="275" y1="102" x2="300" y2="102" class="arrow"/>

  <!-- Expertise travels with the candidate -->
  <rect x="303" y="31" width="180" height="146" rx="4" class="container"/>
  <text x="393" y="51" class="label">MERGE CANDIDATE</text>
  <rect x="319" y="66" width="148" height="78" rx="4" class="principal"/>
  <text x="393" y="91" class="title">project Expertise</text>
  <text x="393" y="111" class="text">.fluent/expertise/</text>
  <text x="393" y="127" class="text">tracked with change</text>

  <!-- Future work -->
  <line x1="483" y1="102" x2="515" y2="102" class="arrow"/>
  <text x="499" y="83" class="label">AFTER</text>
  <text x="499" y="92" class="label">LAND</text>
  <rect x="518" y="42" width="150" height="126" rx="4" class="container"/>
  <text x="593" y="62" class="label">FUTURE WORK</text>
  <rect x="532" y="74" width="122" height="24" rx="4" class="box"/>
  <text x="593" y="90" class="text">planning decisions</text>
  <rect x="532" y="106" width="122" height="24" rx="4" class="box"/>
  <text x="593" y="122" class="text">Writers</text>
  <rect x="532" y="138" width="122" height="24" rx="4" class="box"/>
  <text x="593" y="154" class="text">Reviewers</text>

  <!-- Human curation -->
  <path d="M393 188 V148" class="curation"/>
  <text x="393" y="199" class="text">you inspect + edit</text>

  <text x="340" y="220" class="caption">Follow-up Work changes what happens next. Expertise changes how future Work is done.</text>
</svg>
