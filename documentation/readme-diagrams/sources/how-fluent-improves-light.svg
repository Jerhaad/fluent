<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Menlo">
  <defs>
    <style>
      .box { stroke: #ddd; stroke-width: 1; fill: #f6f6f6; }
      .principal { stroke: #999; stroke-width: 1.25; fill: #f6f6f6; }
      .gate { stroke: #999; stroke-width: 1.25; fill: none; }
      .title { fill: #292929; font-size: 9.5px; font-weight: 600; text-anchor: middle; }
      .text { fill: #999; font-size: 8px; text-anchor: middle; }
      .label { fill: #bbb; font-size: 8px; text-anchor: middle; letter-spacing: 0.5px; }
      .row-label { fill: #bbb; font-size: 8px; text-anchor: start; letter-spacing: 0.5px; }
      .arrow { stroke: #292929; stroke-width: 1; fill: none; marker-end: url(#arrowhead); }
      .return { stroke: #999; stroke-width: 1; fill: none; marker-end: url(#muted-arrowhead); }
      .optional { stroke: #999; stroke-width: 1; stroke-dasharray: 3 3; fill: none; marker-end: url(#muted-arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#292929"/>
    </marker>
    <marker id="muted-arrowhead" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#999"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="330" fill="#ffffff"/>

  <!-- Current Attempt correction loop -->
  <text x="15" y="18" class="row-label">CURRENT ATTEMPT</text>
  <rect x="15" y="32" width="100" height="54" rx="4" class="box"/>
  <text x="65" y="55" class="title">blocking failure</text>
  <text x="65" y="72" class="text">review or new test</text>
  <line x1="115" y1="59" x2="142" y2="59" class="arrow"/>

  <rect x="145" y="32" width="120" height="54" rx="4" class="box"/>
  <text x="205" y="55" class="title">Writer corrects</text>
  <text x="205" y="72" class="text">current candidate</text>
  <line x1="265" y1="59" x2="297" y2="59" class="arrow"/>

  <rect x="300" y="32" width="145" height="54" rx="4" class="box"/>
  <text x="372.5" y="55" class="title">Tester + reviewers</text>
  <text x="372.5" y="72" class="text">check the revision</text>
  <line x1="445" y1="59" x2="477" y2="59" class="arrow"/>

  <rect x="480" y="32" width="130" height="54" rx="4" class="principal"/>
  <text x="545" y="55" class="title">current candidate</text>
  <text x="545" y="72" class="text">continues toward ready</text>
  <path d="M545 86 V105 H205 V90" class="return"/>
  <text x="375" y="104" class="text">failed again</text>

  <!-- Learner follow-up after land -->
  <text x="15" y="132" class="row-label">AFTER LAND · LEARNER FOLLOW-UP</text>
  <rect x="15" y="150" width="95" height="64" rx="4" class="principal"/>
  <text x="62.5" y="176" class="title">Observation</text>
  <text x="62.5" y="194" class="text">landed finding</text>
  <line x1="110" y1="182" x2="132" y2="182" class="arrow"/>

  <rect x="135" y="145" width="120" height="74" rx="4" class="box"/>
  <text x="195" y="169" class="title">corrective gate</text>
  <text x="195" y="188" class="text">settled + grounded</text>
  <text x="195" y="203" class="text">bounded + testable</text>
  <line x1="255" y1="182" x2="282" y2="182" class="arrow"/>

  <rect x="285" y="150" width="100" height="64" rx="4" class="principal"/>
  <text x="335" y="176" class="title">proposed</text>
  <text x="335" y="191" class="title">Work Item</text>
  <line x1="385" y1="182" x2="406" y2="182" class="arrow"/>

  <line x1="410" y1="145" x2="410" y2="219" class="gate"/>
  <text x="410" y="137" class="label">YOU</text>
  <text x="410" y="232" class="text">authorize</text>
  <line x1="414" y1="182" x2="437" y2="182" class="arrow"/>

  <rect x="440" y="145" width="120" height="74" rx="4" class="box"/>
  <text x="500" y="169" class="title">scheduler</text>
  <text x="500" y="188" class="text">you start it</text>
  <text x="500" y="203" class="text">same build loop</text>
  <line x1="560" y1="182" x2="583" y2="182" class="arrow"/>

  <rect x="586" y="150" width="82" height="64" rx="4" class="principal"/>
  <text x="627" y="176" class="title">ready</text>
  <text x="627" y="191" class="title">candidate</text>
  <text x="627" y="207" class="text">not landed</text>

  <path d="M195 219 V232" class="return"/>
  <text x="195" y="246" class="text">new decision → Observation only</text>

  <!-- Separate post-merge review path -->
  <text x="15" y="272" class="row-label">SEPARATE · OPT-IN POST-MERGE REVIEW</text>
  <text x="72" y="304" class="text">fresh land + opt-in</text>
  <line x1="130" y1="301" x2="157" y2="301" class="optional"/>
  <rect x="160" y="284" width="125" height="34" rx="4" class="box"/>
  <text x="222.5" y="305" class="title">post-merge review</text>
  <line x1="285" y1="301" x2="317" y2="301" class="arrow"/>
  <text x="301" y="279" class="text">on fail / uncertain</text>
  <rect x="320" y="284" width="130" height="34" rx="4" class="box"/>
  <text x="385" y="305" class="title">forward-fix Attempt</text>
  <line x1="450" y1="301" x2="480" y2="301" class="arrow"/>
  <rect x="483" y="284" width="180" height="34" rx="4" class="principal"/>
  <text x="573" y="305" class="title">candidate waits for you</text>
</svg>
