<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="Menlo">
  <defs>
    <style>
      .region { fill: none; stroke: #D0D7DE; stroke-width: 1; }
      .card { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1; }
      .actor-box { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1; }
      .icon { fill: none; stroke: #1F2328; stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
      .title { fill: #1F2328; font-size: 8.2px; font-weight: 600; text-anchor: middle; }
      .region-title { fill: #1F2328; font-size: 8.8px; font-weight: 600; text-anchor: middle; }
      .text { fill: #59636E; font-size: 5.8px; text-anchor: middle; }
      .flow-label { fill: #B45309; font-size: 5.5px; font-weight: 600; text-anchor: middle; }
      .connector { fill: none; stroke: #B45309; stroke-width: 1; marker-end: url(#arrowhead); }
      .return { fill: none; stroke: #B45309; stroke-width: 1; stroke-dasharray: 3 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#B45309"/>
    </marker>
    <pattern id="dot-grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#8C959F" opacity="0.2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="680" height="420" fill="#FFFFFF"/>
  <rect x="18" y="18" width="644" height="384" fill="url(#dot-grid)"/>

  <!-- Optional starting Observation -->
  <rect x="18" y="210" width="75" height="120" rx="3" class="card"/>
  <path d="M47 231 Q55.5 222 64 231 Q55.5 240 47 231 Z" class="icon"/>
  <circle cx="55.5" cy="231" r="2.8" class="icon"/>
  <text x="55.5" y="262" class="title">Observation</text>
  <text x="55.5" y="289" class="text">Something to</text>
  <text x="55.5" y="299" class="text">explore, build,</text>
  <text x="55.5" y="309" class="text">fix, or improve.</text>
  <line x1="93" y1="270" x2="111" y2="270" class="connector"/>

  <!-- Conversation -->
  <rect x="102" y="25" width="461" height="370" rx="3" class="region"/>
  <text x="332.5" y="42" class="region-title">Shape a slice in conversation</text>

  <!-- Collaboration -->
  <rect x="136" y="80" width="94" height="46" rx="3" class="actor-box"/>
  <circle cx="159" cy="96" r="3" class="icon"/>
  <path d="M152 110 Q159 102 166 110" class="icon"/>
  <text x="194" y="106" class="title">You</text>
  <rect x="450" y="80" width="94" height="46" rx="3" class="actor-box"/>
  <text x="497" y="107" class="title">Fluent</text>

  <text x="340" y="87" class="flow-label">Focused questions and options with tradeoffs</text>
  <line x1="435" y1="97" x2="245" y2="97" class="connector"/>
  <line x1="245" y1="109" x2="435" y2="109" class="connector"/>
  <text x="340" y="123" class="flow-label">Additional context, judgments, and decisions</text>

  <text x="332.5" y="148" class="text">Fluent combines project knowledge with its built-in expertise in</text>
  <text x="332.5" y="160" class="text">structured thinking, design, architecture, and planning.</text>

  <!-- Four layers -->
  <text x="160" y="202" class="flow-label">or begin here</text>

  <rect x="112" y="210" width="96" height="120" rx="3" class="card"/>
  <path d="M151 222 H166 Q169 222 169 225 V233 Q169 236 166 236 H158 L152 242 L154 236 H151 Q148 236 148 233 V225 Q148 222 151 222 Z" class="icon"/>
  <text x="160" y="262" class="title">Brief</text>
  <text x="160" y="289" class="text">A small slice</text>
  <text x="160" y="299" class="text">of functionality,</text>
  <text x="160" y="309" class="text">in your words.</text>

  <line x1="208" y1="270" x2="217" y2="270" class="connector"/>

  <rect x="218" y="210" width="100" height="120" rx="3" class="card"/>
  <rect x="260" y="221" width="16" height="15" rx="1" class="icon"/>
  <path d="M263 226 L265 228 L268 224 M270 226 H273 M263 232 L265 234 L268 230 M270 232 H273" class="icon"/>
  <text x="268" y="257" class="title">Behavior</text>
  <text x="268" y="268" class="title">Specifications</text>
  <text x="268" y="291" class="text">How the software must</text>
  <text x="268" y="301" class="text">behave in a particular</text>
  <text x="268" y="311" class="text">situation.</text>

  <line x1="318" y1="270" x2="327" y2="270" class="connector"/>

  <rect x="328" y="210" width="100" height="120" rx="3" class="card"/>
  <rect x="366" y="221" width="6" height="5" rx="0.8" class="icon"/>
  <rect x="384" y="221" width="6" height="5" rx="0.8" class="icon"/>
  <rect x="375" y="233" width="6" height="5" rx="0.8" class="icon"/>
  <path d="M372 223.5 H384 M369 226 V235.5 H375 M387 226 V235.5 H381" class="icon"/>
  <text x="378" y="257" class="title">Technical</text>
  <text x="378" y="268" class="title">Approach</text>
  <text x="378" y="291" class="text">Your technical decisions</text>
  <text x="378" y="301" class="text">and reasoning to guide</text>
  <text x="378" y="311" class="text">implementation.</text>

  <line x1="428" y1="270" x2="437" y2="270" class="connector"/>

  <rect x="438" y="210" width="110" height="120" rx="3" class="card"/>
  <path d="M483 223 H489 V228 H495 V234 H502 M499 231 L502 234 L499 237" class="icon"/>
  <circle cx="483" cy="223" r="1.3" class="icon"/>
  <text x="493" y="257" class="title">Implementation</text>
  <text x="493" y="268" class="title">Plan</text>
  <text x="493" y="289" class="text">How to divide the slice,</text>
  <text x="493" y="299" class="text">order the work into steps,</text>
  <text x="493" y="309" class="text">and know when each step</text>
  <text x="493" y="319" class="text">is complete.</text>

  <!-- Iteration -->
  <path d="M493 330 V360 H160 V334" class="return"/>
  <text x="326.5" y="380" class="flow-label">revise an earlier layer when a gap appears</text>

  <!-- Work Item output -->
  <text x="619" y="202" class="flow-label">one or more</text>
  <line x1="548" y1="270" x2="584" y2="270" class="connector"/>
  <text x="566" y="261" class="flow-label">approve</text>
  <rect x="598" y="218" width="66" height="120" rx="3" class="card"/>
  <rect x="590" y="210" width="66" height="120" rx="3" class="card"/>
  <text x="623" y="257" class="title">Work Item</text>
  <text x="623" y="284" class="text">Planned work</text>
  <text x="623" y="294" class="text">that can be built</text>
  <text x="623" y="304" class="text">and reviewed</text>
  <text x="623" y="314" class="text">independently.</text>
</svg>
