<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" font-family="Menlo">
  <defs>
    <style>
      .queue-frame { fill: none; stroke: #D0D7DE; stroke-width: 1; }
      .ticket-work { fill: #426D91; }
      .ticket-input { fill: #735C8E; }
      .ticket-change { fill: #4F765C; }
      .lane-title { fill: #1F2328; font-size: 10px; font-weight: 600; letter-spacing: 0.55px; }
      .ticket-label { fill: #FFFFFF; font-size: 5.7px; font-weight: 600; letter-spacing: 0.12px; text-anchor: middle; dominant-baseline: middle; }
      .flow-label { fill: #B45309; font-size: 7px; font-weight: 600; letter-spacing: 0.16px; text-anchor: middle; }
      .connector { fill: none; stroke: #B45309; stroke-width: 1; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#B45309"/>
    </marker>
    <pattern id="dot-grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#8C959F" opacity="0.2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="680" height="390" fill="#FFFFFF"/>
  <rect x="18" y="18" width="644" height="354" fill="url(#dot-grid)"/>

  <g transform="translate(0 12)">
  <!-- Work waiting for a person -->
  <g transform="translate(16 0)">
  <text x="140" y="45" class="lane-title">WAITING FOR HUMAN ATTENTION</text>
  </g>
  <text x="82" y="80" class="flow-label">New observations and</text>
  <text x="82" y="91" class="flow-label">agent handoffs</text>
  <line x1="34" y1="106" x2="150" y2="106" class="connector"/>

  <g transform="translate(16 0)">
  <rect x="140" y="60" width="400" height="92" rx="3" class="queue-frame"/>
  <rect x="152" y="72" width="24" height="68" rx="2" class="ticket-work"/>
  <text x="164" y="106" class="ticket-label" transform="rotate(-90 164 106)">OBSERVATION</text>
  <rect x="182" y="72" width="24" height="68" rx="2" class="ticket-input"/>
  <text x="194" y="106" class="ticket-label" transform="rotate(-90 194 106)">NEEDS-USER HANDOFF</text>
  <rect x="212" y="72" width="24" height="68" rx="2" class="ticket-change"/>
  <text x="224" y="106" class="ticket-label" transform="rotate(-90 224 106)">MERGE CANDIDATE</text>
  <rect x="242" y="72" width="24" height="68" rx="2" class="ticket-work"/>
  <rect x="272" y="72" width="24" height="68" rx="2" class="ticket-input"/>
  <rect x="302" y="72" width="24" height="68" rx="2" class="ticket-change"/>
  <rect x="332" y="72" width="24" height="68" rx="2" class="ticket-work"/>
  <rect x="362" y="72" width="24" height="68" rx="2" class="ticket-input"/>
  <rect x="392" y="72" width="24" height="68" rx="2" class="ticket-change"/>
  <rect x="422" y="72" width="24" height="68" rx="2" class="ticket-work"/>
  <rect x="452" y="72" width="24" height="68" rx="2" class="ticket-input"/>
  <rect x="482" y="72" width="24" height="68" rx="2" class="ticket-change"/>
  <rect x="510" y="72" width="24" height="68" rx="2" class="ticket-work"/>
  </g>

  <!-- Work waiting for agent and compute capacity -->
  <g transform="translate(16 0)">
  <text x="140" y="223" class="lane-title">WAITING FOR AGENT AND COMPUTE CAPACITY</text>
  </g>
  <text x="82" y="258" class="flow-label">Shaped work, answers,</text>
  <text x="82" y="269" class="flow-label">and approvals</text>
  <line x1="34" y1="284" x2="150" y2="284" class="connector"/>

  <g transform="translate(16 0)">
  <rect x="140" y="238" width="400" height="92" rx="3" class="queue-frame"/>
  <rect x="152" y="250" width="24" height="68" rx="2" class="ticket-work"/>
  <text x="164" y="284" class="ticket-label" transform="rotate(-90 164 284)">WORK ITEM</text>
  <rect x="182" y="250" width="24" height="68" rx="2" class="ticket-input"/>
  <text x="194" y="284" class="ticket-label" transform="rotate(-90 194 284)">ATTEMPT</text>
  <rect x="212" y="250" width="24" height="68" rx="2" class="ticket-change"/>
  <text x="224" y="284" class="ticket-label" transform="rotate(-90 224 284)">MERGE CANDIDATE</text>
  <rect x="242" y="250" width="24" height="68" rx="2" class="ticket-work"/>
  <rect x="272" y="250" width="24" height="68" rx="2" class="ticket-input"/>
  <rect x="302" y="250" width="24" height="68" rx="2" class="ticket-change"/>
  <rect x="332" y="250" width="24" height="68" rx="2" class="ticket-work"/>
  <rect x="362" y="250" width="24" height="68" rx="2" class="ticket-input"/>
  <rect x="392" y="250" width="24" height="68" rx="2" class="ticket-change"/>
  <rect x="422" y="250" width="24" height="68" rx="2" class="ticket-work"/>
  <rect x="452" y="250" width="24" height="68" rx="2" class="ticket-input"/>
  <rect x="482" y="250" width="24" height="68" rx="2" class="ticket-change"/>
  <rect x="510" y="250" width="24" height="68" rx="2" class="ticket-work"/>
  </g>
  </g>
</svg>
